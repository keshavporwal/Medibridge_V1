<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wireframe — Public Patient Share Pass</title>
  <link rel="stylesheet" href="assets/wireframe.css" />
</head>
<body>
  <div class="wf">
    <p class="muted">US-14 · Wireframe — Public Patient Share Pass (QR destination, no login)</p>

    <div class="box between">
      <strong>MediBridge</strong>
      <span class="muted small">Read-only shared pass</span>
    </div>

    <div class="box">
      <div class="img">Photo + patient name</div>
      <div class="table">
        <div>Name · MRN</div>
        <div>DOB · blood group</div>
        <div>Emergency contact · allergies</div>
      </div>
      <p class="muted small">Note: read-only, minimal fields only; served as a standalone hosted webpage</p>
    </div>
  </div>
</body>
</html>
