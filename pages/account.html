<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account &amp; Security — MediBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topnav">
      <div class="row">
        <a class="brand" id="brand-home" href="patient-hub.html">
          <span class="brand-mark"><span class="material-symbols-outlined">health_and_safety</span></span>
          <span class="col"><span class="brand-name">MediBridge</span><span class="brand-tag">Account &amp; Security</span></span>
        </a>
      </div>
      <div class="nav-actions">
        <div class="profile">
          <div class="profile-meta">
            <span class="profile-name" data-user-name>User</span>
            <span class="label-sm muted" data-user-title>Role</span>
          </div>
          <div class="avatar" data-avatar>U</div>
          <button class="icon-btn" data-logout aria-label="Sign out"><span class="material-symbols-outlined">logout</span></button>
        </div>
      </div>
    </header>

    <main class="page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a id="crumb-home" href="patient-hub.html"><span class="material-symbols-outlined">home</span><span id="crumb-home-label">Home</span></a>
        <span class="material-symbols-outlined sep">chevron_right</span>
        <span class="current">Account &amp; Security</span>
      </nav>
      <div class="page-header">
        <h1 class="page-title">Account &amp; Security</h1>
        <p class="page-subtitle">Review your account details and update your password.</p>
      </div>

      <div class="bento">
        <!-- Account information -->
        <div class="span-5 card">
          <div class="card-header"><span class="card-title">Account Information</span></div>
          <div class="list" id="account-info"></div>
        </div>

        <!-- Change password -->
        <div class="span-7 card">
          <div class="card-header"><span class="card-title">Change Password</span></div>
          <form id="password-form" novalidate>
            <div class="field">
              <label class="field-label required" for="cur-pw">Current password</label>
              <div class="input-group">
                <input class="input" id="cur-pw" type="password" required placeholder="Enter current password" autocomplete="current-password" />
                <button type="button" class="input-affix" data-toggle-pw="cur-pw" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button>
              </div>
              <span class="field-error"></span>
            </div>
            <div class="field">
              <label class="field-label required" for="new-pw">New password</label>
              <div class="input-group">
                <input class="input" id="new-pw" type="password" required placeholder="At least 8 characters" data-min="8" />
                <button type="button" class="input-affix" data-toggle-pw="new-pw" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button>
              </div>
              <div class="strength" id="pw-strength"><span></span><span></span><span></span><span></span></div>
              <span class="strength-label muted" id="pw-strength-label">Use 8+ chars with an uppercase letter, a number, and a symbol.</span>
              <span class="field-error"></span>
            </div>
            <div class="field">
              <label class="field-label required" for="confirm-pw">Confirm new password</label>
              <input class="input" id="confirm-pw" type="password" required placeholder="Re-enter new password" data-match="#new-pw" />
              <span class="field-error"></span>
            </div>
            <p class="required-note">Required fields</p>
            <button class="btn btn-primary" type="submit" style="margin-top:var(--space-sm)"><span class="material-symbols-outlined">lock_reset</span>Update password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pages/account.js"></script>
</body>
</html>
