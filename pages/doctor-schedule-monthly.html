<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Calendar — MediBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topnav">
      <div class="row">
        <a class="brand" href="doctor-dashboard.html">
          <span class="brand-mark"><span class="material-symbols-outlined">health_and_safety</span></span>
          <span class="col"><span class="brand-name">MediBridge</span><span class="brand-tag">Clinical Care Grid</span></span>
        </a>
      </div>
      <div class="nav-actions">
        <div class="profile">
          <div class="profile-meta">
            <span class="profile-name" data-user-name>Doctor</span>
            <span class="label-sm muted" data-user-title>Cardiology / Attending</span>
          </div>
          <div class="avatar" data-avatar>EV</div>
          <button class="icon-btn" data-logout aria-label="Sign out"><span class="material-symbols-outlined">logout</span></button>
        </div>
      </div>
    </header>

    <main class="page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="doctor-dashboard.html"><span class="material-symbols-outlined">home</span>Workspace</a>
        <span class="material-symbols-outlined sep">chevron_right</span>
        <span class="current">Monthly Calendar</span>
      </nav>
      <div class="page-header row-between">
        <div>
          <h1 class="page-title">Monthly Calendar</h1>
          <p class="page-subtitle">Month-at-a-glance scheduling grid.</p>
        </div>
        <div class="row gap-sm">
          <button class="icon-btn" id="cal-prev" aria-label="Previous month"><span class="material-symbols-outlined">chevron_left</span></button>
          <span class="card-title" id="cal-title" style="min-width:160px;text-align:center">Month</span>
          <button class="icon-btn" id="cal-next" aria-label="Next month"><span class="material-symbols-outlined">chevron_right</span></button>
          <button class="btn btn-ghost btn-sm" id="cal-today">Today</button>
        </div>
      </div>

      <div class="card">
        <div class="cal-grid" id="calendar"></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pages/doctor-schedule-monthly.js"></script>
</body>
</html>
