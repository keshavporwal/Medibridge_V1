<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Recovery — MediBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <header class="topnav">
    <a class="brand" href="login.html">
      <span class="brand-mark"><span class="material-symbols-outlined">health_and_safety</span></span>
      <span class="col"><span class="brand-name">MediBridge</span><span class="brand-tag">Account Recovery</span></span>
    </a>
    <div class="stepper" style="margin:0">
      <div class="step active"><span class="step-dot">1</span><span class="label-md">Verify identity</span></div>
      <span class="step-line"></span>
      <div class="step"><span class="step-dot">2</span><span class="label-md">New password</span></div>
    </div>
  </header>

  <main style="display:grid;place-items:center;padding:var(--space-2xl) var(--space-base)">
    <div style="max-width:520px;width:100%">
      <div class="card">
        <span class="badge badge-primary"><span class="material-symbols-outlined" style="font-size:14px">shield</span>Identity verification</span>
        <h1 class="headline-lg" style="margin:var(--space-sm) 0 var(--space-xs)">Recover your account</h1>
        <p class="body-sm muted">Enter your registered email, then answer your 3 security questions.</p>

        <!-- Step 1: find account -->
        <form id="email-form" novalidate style="margin-top:var(--space-lg)">
          <div class="field">
            <label class="field-label required" for="rec-email">Registered email</label>
            <input class="input" id="rec-email" type="email" data-type="email" required placeholder="aarav.sharma@example.in" />
            <span class="field-error"></span>
          </div>
          <button class="btn btn-primary btn-block" type="submit"><span class="material-symbols-outlined">search</span>Find account</button>
        </form>

        <!-- Step 2: answer questions -->
        <form id="questions-form" class="hidden" novalidate style="margin-top:var(--space-lg)">
          <div class="card card-pad-sm" style="background:var(--surface-container-low);border:none;margin-bottom:var(--space-base)">
            <div class="row gap-sm">
              <div class="avatar" id="rec-initials">--</div>
              <div class="col"><span class="strong" id="rec-name">Account</span><span class="list-sub" id="rec-email-label"></span></div>
            </div>
          </div>
          <div id="demo-hint" class="notice hidden" style="margin-bottom:var(--space-base)">
            <span class="material-symbols-outlined">info</span>
            <div class="body-sm"><span class="strong">Demo answers:</span> <span id="demo-hint-text"></span></div>
          </div>
          <div id="questions-list"></div>
          <div class="row gap-xs muted body-sm" id="attempts-note" style="margin:var(--space-sm) 0"><span class="material-symbols-outlined" style="font-size:16px">lock_clock</span>3 attempts allowed.</div>
          <p class="required-note">Required fields</p>
          <button class="btn btn-primary btn-block" type="submit" id="verify-btn" style="margin-top:var(--space-sm)"><span>Verify &amp; continue</span><span class="material-symbols-outlined">arrow_forward</span></button>
        </form>

        <div class="admin-link"><a href="login.html">&larr; Back to sign in</a></div>
      </div>
    </div>
  </main>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pages/forgot-questions.js"></script>
</body>
</html>
