<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — MediBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <header class="topnav">
    <a class="brand" href="login.html">
      <span class="brand-mark"><span class="material-symbols-outlined">health_and_safety</span></span>
      <span class="col"><span class="brand-name">MediBridge</span><span class="brand-tag">Account Recovery</span></span>
    </a>
    <div class="stepper" style="margin:0">
      <div class="step done"><span class="step-dot"><span class="material-symbols-outlined" style="font-size:16px">check</span></span><span class="label-md">Verify identity</span></div>
      <span class="step-line"></span>
      <div class="step active"><span class="step-dot">2</span><span class="label-md">New password</span></div>
    </div>
  </header>

  <main style="display:grid;place-items:center;padding:var(--space-2xl) var(--space-base)">
    <div style="max-width:480px;width:100%">
      <div class="card">
        <span class="badge badge-success"><span class="material-symbols-outlined" style="font-size:14px">verified</span>Identity verified</span>
        <h1 class="headline-lg" style="margin:var(--space-sm) 0 var(--space-xs)">Set a new password</h1>
        <p class="body-sm muted">Choose a strong password for <span class="strong" id="acct-email">your account</span>.</p>

        <form id="reset-form" novalidate style="margin-top:var(--space-lg)">
          <div class="field">
            <label class="field-label required" for="new-pw">New password</label>
            <div class="input-group">
              <input class="input" id="new-pw" type="password" required placeholder="At least 8 characters" data-min="8" />
              <button type="button" class="input-affix" data-toggle-pw="new-pw" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button>
            </div>
            <div class="strength" id="pw-strength"><span></span><span></span><span></span><span></span></div>
            <span class="strength-label muted" id="pw-strength-label">Use 8+ chars with an uppercase letter, a number, and a symbol.</span>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label class="field-label required" for="confirm-pw">Confirm password</label>
            <input class="input" id="confirm-pw" type="password" required placeholder="Re-enter password" data-match="#new-pw" />
            <span class="field-error"></span>
          </div>
          <label class="check-row" style="margin:var(--space-sm) 0 var(--space-base)">
            <input type="checkbox" id="terminate" checked /> Sign out of all other active sessions
          </label>
          <p class="required-note">Required fields</p>
          <button class="btn btn-primary btn-block" type="submit" style="margin-top:var(--space-sm)"><span class="material-symbols-outlined">lock_reset</span>Update password</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pages/forgot-reset.js"></script>
</body>
</html>
